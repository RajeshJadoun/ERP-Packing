[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-packing-backend"
version = "0.1.0"
description = "Flask API foundation for the Packing Material Inventory and BOM Management System"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4.0",
  "Flask-Cors>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
