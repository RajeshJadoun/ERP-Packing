name: Authenticated Staging E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-staging-e2e.yml"
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/authenticated-staging-e2e.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packing-erp-authenticated-staging-e2e
  # Cancel superseded runs so the newest PR revision gets the staging test slot.
  cancel-in-progress: true

jobs:
  authenticated-staging-e2e:
    # Never expose staging credentials to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Allows secrets stored either at repo level or in the GitHub "staging" environment.
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Exact staging target locks. Never point this workflow at the operational project/API.
      E2E_ENV: staging
      E2E_EXPECTED_SUPABASE_REF: pcrttrimxeoiabncnfan
      E2E_ALLOW_MUTATIONS: "false"
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: https://packing-erp-staging-api.onrender.com/api/v1
      VITE_SUPABASE_URL: https://pcrttrimxeoiabncnfan.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: https://packing-erp-staging-api.onrender.com/api/v1
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Explicit opt-in OR all role credentials present; keeps the checks discoverable even if an environment variable was scoped incorrectly.
      E2E_ROLE_MATRIX_ENABLED: ${{ (vars.E2E_ROLE_MATRIX_ENABLED == 'true' || secrets.E2E_ROLE_MATRIX_ENABLED == 'true' || (secrets.E2E_STOREKEEPER_EMAIL != '' && secrets.E2E_STOREKEEPER_PASSWORD != '' && secrets.E2E_PLANNER_EMAIL != '' && secrets.E2E_PLANNER_PASSWORD != '' && secrets.E2E_OPERATOR_EMAIL != '' && secrets.E2E_OPERATOR_PASSWORD != '' && secrets.E2E_VIEWER_EMAIL != '' && secrets.E2E_VIEWER_PASSWORD != '')) && 'true' || 'false' }}
      E2E_STOREKEEPER_EMAIL: ${{ secrets.E2E_STOREKEEPER_EMAIL }}
      E2E_STOREKEEPER_PASSWORD: ${{ secrets.E2E_STOREKEEPER_PASSWORD }}
      E2E_PLANNER_EMAIL: ${{ secrets.E2E_PLANNER_EMAIL }}
      E2E_PLANNER_PASSWORD: ${{ secrets.E2E_PLANNER_PASSWORD }}
      E2E_OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
      E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
      E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
      E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets and exact staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$E2E_EXPECTED_SUPABASE_REF" = "pcrttrimxeoiabncnfan"
          test "$VITE_SUPABASE_URL" = "https://pcrttrimxeoiabncnfan.supabase.co"
          test "$E2E_BASE_URL" = "http://127.0.0.1:4173"
          test "$E2E_API_URL" = "https://packing-erp-staging-api.onrender.com/api/v1"
          test "$VITE_API_BASE_URL" = "https://packing-erp-staging-api.onrender.com/api/v1"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          echo "Staging-only target checks passed; credentials were not printed."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend with staging configuration
        run: npm run build

      - name: Start local preview and verify it is ready
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/packing-erp-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Local staging-configured preview is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/packing-erp-vite-preview.log
          echo "Preview failed to start." >&2
          exit 1

      - name: Run full browser E2E suite against isolated local preview and staging services
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-staging-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
