          format: uuid
        jobCode:
          type: string
          example: "JOB-20261015-001"
        dailyPlanId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        masterBomId:
          type: string
          format: uuid
          nullable: true
        isCustomized:
          type: boolean
          example: false
        status:
          type: string
          enum: [PENDING, RELEASED, IN_PROGRESS, PARTIALLY_COMPLETED, COMPLETED, CANCELLED]
          example: "RELEASED"
        quantityStatus:
          $ref: '#/components/schemas/PackingJobQuantityStatus'

    RecordProductionCompletionRequest:
      type: object
      required:
        - packingJobId
        - completedUnits
        - workerId
        - completionPolicy
      properties:
        packingJobId:
          type: string
          format: uuid
        completedUnits:
          type: integer
          minimum: 1
          example: 530
        workerId:
          type: string
          format: uuid
        completionPolicy:
          type: string
          enum: [AUTO_BOM_THEORETICAL, CONFIRMED_ACTUAL_ENTRY]
          example: "AUTO_BOM_THEORETICAL"
        actualMaterialUsage:
          type: array
          description: Provided when completionPolicy is CONFIRMED_ACTUAL_ENTRY
          items:
            type: object
            required:
              - materialId
              - physicallyConfirmedQuantity
              - unitId
              - measurementMethod
            properties:
              materialId:
                type: string
                format: uuid
              physicallyConfirmedQuantity:
                type: number
                minimum: 0
                example: 532.0
              unitId:
                type: string
                format: uuid
              measurementMethod:
                type: string
                enum: [SCALE_WEIGHED, SEALED_BUNDLE, MANUALLY_COUNTED]
                example: "SCALE_WEIGHED"

    ProductionCompletionDetailResponse:
      type: object
      required:
        - id
        - packingJobId
        - completedUnits
        - workerId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        packingJobId:
          type: string
          format: uuid
        completedUnits:
          type: integer
          example: 530
        workerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        consumptions:
          type: array
          items:
            type: object
            required:
              - materialId
              - theoreticalQuantity
              - varianceStatus
            properties:
              materialId:
                type: string
                format: uuid
              theoreticalQuantity:
                type: number
                example: 530.0
              physicallyConfirmedQuantity:
                type: number
                nullable: true
              varianceQuantity:
                type: number
                nullable: true
              varianceStatus:
                type: string
                enum: [UNVERIFIED, VERIFIED_ZERO, VARIANCE_RECORDED]
                example: "UNVERIFIED"

    ExecuteDailyCloseRequest:
      type: object
      required:
        - dailyPlanId
        - shiftCode
      properties:
        dailyPlanId:
          type: string
          format: uuid
        shiftCode:
          type: string
          example: "SHIFT_1"
        allowDiscrepancyOverride:
          type: boolean
          default: false
        supervisorOverrideReason:
          type: string
          description: Mandatory if allowDiscrepancyOverride is true.
          example: "Operator on emergency leave; 50 unused screws will be counted and returned tomorrow morning."

    DailyClosingDetailResponse:
      type: object
      required:
        - id
        - dailyPlanId
        - shiftCode
        - closedAt
      properties:
        id:
          type: string
          format: uuid
        dailyPlanId:
          type: string
          format: uuid
        shiftCode:
          type: string
          example: "SHIFT_1"
        totalJobsPlanned:
          type: integer
          example: 4
        totalUnitsPacked:
          type: integer
          example: 1850
        unresolvedDiscrepanciesCount:
          type: integer
          example: 0
        supervisorOverrideReason:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time

    StockMovementResponse:
      description: |
        Standard success envelope returned by all stock movement commands (issue-to-worker,
        return-from-worker, transfer, damage-quarantine, scrap-disposal, purchase-return).
        Contains the created stock transaction identifier and a summary for client confirmation.
      type: object
      required:
        - success
        - stockTransactionId
        - movementType
        - materialId
        - canonicalQuantity
        - canonicalUnitId
        - sourceLocationId
        - destinationLocationId
        - createdAt
      properties:
        success:
          type: boolean
          example: true
        stockTransactionId:
          type: string
          format: uuid
          description: The immutable ledger row ID created for this movement.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        movementType:
          type: string
          enum:
            - ISSUE_TO_WORKER
            - RETURN_FROM_WORKER
            - LOCATION_TRANSFER
            - DAMAGE_QUARANTINE
            - SCRAP_DISPOSAL
            - PURCHASE_RETURN
          example: "ISSUE_TO_WORKER"
        materialId:
          type: string
          format: uuid
        canonicalQuantity:
          type: number
          description: Server-computed authoritative quantity in the material's canonical unit.
          example: 400.0
        canonicalUnitId:
          type: string
          format: uuid
        sourceLocationId:
          type: string
          format: uuid
          nullable: true
        destinationLocationId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    StockAdjustmentDetailResponse:
      description: |
        Audit-grade cycle count adjustment record. Returned by POST /stock/adjustments on success
        and by GET /stock/adjustments/{id} for post-410 recovery (resourceType = STOCK_ADJUSTMENT).
      type: object
      required:
        - id
        - materialId
        - locationId
        - countedQuantity
        - countedUnitId
        - systemQuantityBefore
        - varianceQuantity
        - adjustmentReason
        - supervisorApprovedBy
        - stockTransactionId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: The stock_adjustments table primary key.
        materialId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        countedQuantity:
          type: number
          description: Physical count quantity in counted unit.
          example: 1480.0
        countedUnitId:
          type: string
          format: uuid
        systemQuantityBefore:
          type: number
          description: System on-hand balance immediately prior to adjustment, in canonical unit.
          example: 1500.0
        varianceQuantity:
          type: number
          description: Signed difference (counted_canonical - system_before). Negative = shrinkage.
          example: -20.0
        adjustmentReason:
          type: string
          example: "Quarterly cycle count physical variance (-20 PCS)"
        supervisorApprovedBy:
          type: string
          format: uuid
          description: UUID of the supervisor profile who authorized the adjustment.
        stockTransactionId:
          type: string
          format: uuid
          description: The single stock_transactions row created by this adjustment.
        createdAt:
          type: string
          format: date-time

    ProfileResponse:
      description: |
        User profile record. Returned by GET /admin/users/{targetId} for post-410 recovery
        (resourceType = PROFILE) and by the updateUserProfileAccess command.
      type: object
      required:
        - id
        - email
        - role
        - isActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Supabase auth.uid() — the profile primary key.
        email:
          type: string
          format: email
          example: "storekeeper@factory.internal"
        fullName:
          type: string
          nullable: true
          example: "Ramesh Kumar"
        role:
          type: string
          enum: [ADMIN, STOREKEEPER, PLANNER, OPERATOR, VIEWER]
          example: "STOREKEEPER"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ProfileAccessUpdateResponse:
      description: |
        Confirmation envelope returned after a successful POST /admin/users/{targetId}/access command.
        Contains the updated profile state and the audit log entry ID for traceability.
      type: object
      required:
        - success
        - profile
        - auditLogId
      properties:
        success:
          type: boolean
          example: true
        profile:
          $ref: '#/components/schemas/ProfileResponse'
        auditLogId:
          type: string
          format: uuid
          description: The audit_logs row ID created for this role/status change event.
